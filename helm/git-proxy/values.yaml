replicaCount: 1

image:
  repository: ghcr.io/ls1intum/theia-lite-git-proxy
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

gitProxy:
  # Comma-separated allowlist of upstream git hosts the proxy may reach.
  # REQUIRED: the proxy fails closed and rejects every request when this is empty.
  allowedHosts: "github.com,gitlab.com,bitbucket.org"
  # Value for the Access-Control-Allow-Origin header. Empty leaves it unset.
  allowOrigin: ""
  # Optional HS256 JWT secret. When set, only requests carrying a valid JWT in
  # the X-Authorization header are proxied. Prefer sourcing this from a Secret.
  authSecret: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 9999

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: git-proxy.theia.artemis.cit.tum.de
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: git-proxy-tls
      hosts:
        - git-proxy.theia.artemis.cit.tum.de

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
